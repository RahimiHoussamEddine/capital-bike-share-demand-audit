[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-bike-share-demand-audit"
version = "0.1.0"
description = "Leakage-safe hourly bike-share demand forecasting audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "plotly==7.1.0",
  "scikit-learn==1.9.1",
  "starlette==0.50.0",
  "streamlit==1.66.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.3", "setuptools==81.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
