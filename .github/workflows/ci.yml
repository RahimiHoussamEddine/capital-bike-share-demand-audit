name: quality-and-container

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: python -m venv .venv && make install-dev
      - name: Build pinned source reports
        run: make fetch build
      - name: Validate code and artifacts
        run: make verify test quality check-deps
      - name: Build API container
        run: docker build -t capital-bike-share-demand-audit .
      - name: Check container API
        run: |
          docker run --detach --rm --name bike-share-audit -p 8000:8000 capital-bike-share-demand-audit
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          docker stop bike-share-audit
